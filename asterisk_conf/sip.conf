[general]
localnet=192.168.100.0/24
# localnet=192.168.0.0/16
externip=192.168.100.222
nat=no  ; Helps with NAT traversal
directmedia=no  ; Ensures Asterisk handles media correctly
canreinvite=no
context=default           ; Default context for incoming calls
bindaddr=0.0.0.0          ; Listen on all IP addresses
allow=ulaw                ; Allow G.711 u-law codec
# allow=alaw                ; Allow G.711 a-law codec

[1000]
type=friend
host=dynamic
secret=your_password
context=default
disallow=all
allow=ulaw
# allow=alaw


[1003]
type=friend
host=dynamic
secret=your_password
context=default
disallow=all
allow=ulaw
# allow=alaw
